<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoManager - Meu Perfil</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/profile.css">
  <link rel="shortcut icon" href="../img/ecomanager.png" type="image/x-icon">
</head>
<body>

  <header>
    <nav class="navbar" id="navbar">
      <a href="../index.html" class="logo">
        <img src="../img/logo-nome.png" alt="EcoManager Logo">
      </a>
      <ul class="nav-links" id="navLinks">
        <li><a class="nav-link" href="../index.html">Início</a></li>
        <li><a class="nav-link" href="./ferramentas.html">Ferramentas</a></li>
        <li><a class="nav-link" href="./esg-e-metas.html">ESG & Metas</a></li>
        <li><a class="nav-link" href="./sobre.html">Sobre</a></li>
        <li><a class="nav-link" href="./contato.html">Contato</a></li>
        <li><a class="nav-link" href="/html/login.html" style="display: none;">Login</a></li>
      </ul>
      <button class="hamburger" id="hamburger-btn" aria-label="Abrir menu"><i class="fas fa-bars"></i></button>
      <div class="profile-card" style="display: none;">
          <div class="avatar"><a href="./profile.html"><i class="fas fa-user"></i></a></div>
      </div>
    </nav>
  </header>
  <div class="nav-overlay" id="nav-overlay"></div>

  <main class="profile-page-main">
    <div class="container">
      <div class="profile-content">
        <div class="profile-avatar-section">
          <img id="profile-picture" src="../img/default-avatar.png" alt="Foto de Perfil">
          <p id="profile-greeting">Carregando...</p>
        </div>

        <form id="profile-form" class="profile-form">
          <div class="form-group">
            <label for="profile-name">Nome de Exibição</label>
            <input type="text" id="profile-name" placeholder="Como você quer ser chamado?">
          </div>
          <div class="form-group">
            <label for="profile-email">Email</label>
            <input type="email" id="profile-email" disabled>
            <small>O email não pode ser alterado.</small>
          </div>
          
          <div class="form-actions">
            <button type="submit" class="btn-primary">Salvar Alterações</button>
            <button type="button" id="logout-btn" class="btn-logout">Logout</button>
          </div>
          <div id="notification-message" class="notification" style="display: none;"></div>
        </form>
      </div>
    </div>
  </main>

  <script type="module" src="../js/app.js"></script>
  <script type="module" src="../js/profile.js"></script>
</body>
</html>
