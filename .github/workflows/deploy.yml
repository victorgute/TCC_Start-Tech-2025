name: Deploy to EC2

on:
  push:
    branches: [ main ] # ou a sua branch principal

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: SSH and Deploy
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd /home/ec2-user/TCC_Start-Tech-2025
          git pull
          echo "Instalando dependências do backend..."
          cd backend
          npm install
          echo "Instalando e fazendo build do frontend..."
          cd ../frontend
          npm install
          VITE_OPENAI_API_KEY=${{ secrets.VITE_OPENAI_API_KEY }} npm run build
          echo
          cd ../backend
          pm2 restart ecosystem.config.cjs