name: Deploy Frontend to AWS S3

on:
  push:
    branches:
      - main
    paths:
      - 'css/**'
      - 'html/**'
      - 'img/**'
      - 'js/**'
      - '*.html'

jobs:
  deploy-to-s3:
    name: Deploy Frontend to S3
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2 # A sua região de Ohio

      # COMANDO DE SINCRONIZAÇÃO CORRIGIDO COM A FLAG --region
      - name: Sync files to S3 bucket
        run: |
          aws s3 sync . s3://software-sustentabilidade-frontend --region us-east-2 --delete --exclude ".git/*" --exclude ".github/*" --exclude "back-end/*" --exclude "Dockerfile"

